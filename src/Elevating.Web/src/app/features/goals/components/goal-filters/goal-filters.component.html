<section class="app-card p-5 sm:p-6">
  <div class="grid gap-4 lg:grid-cols-4">
    <div class="lg:col-span-2">
      <label for="goal-search" class="form-label"> Search </label>

      <input
        id="goal-search"
        type="search"
        [formControl]="form.controls.search"
        placeholder="Search titles or descriptions..."
        class="form-control"
      />
    </div>

    <div>
      <label for="goal-category" class="form-label"> Category </label>

      <input
        id="goal-category"
        type="text"
        [formControl]="form.controls.category"
        placeholder="Development"
        class="form-control"
      />
    </div>

    <div>
      <label for="goal-status" class="form-label"> Status </label>

      <select id="goal-status" [formControl]="form.controls.status" class="form-control">
        <option [ngValue]="null">All statuses</option>

        @for (status of statuses; track status.value) {
          <option [ngValue]="status.value">
            {{ status.label }}
          </option>
        }
      </select>
    </div>

    <div>
      <label for="goal-priority" class="form-label"> Priority </label>

      <select id="goal-priority" [formControl]="form.controls.priority" class="form-control">
        <option [ngValue]="null">All priorities</option>

        @for (priority of priorities; track priority.value) {
          <option [ngValue]="priority.value">
            {{ priority.label }}
          </option>
        }
      </select>
    </div>

    <div>
      <label for="goal-sort" class="form-label"> Sort by </label>

      <select id="goal-sort" [formControl]="form.controls.sortBy" class="form-control">
        @for (field of sortFields; track field.value) {
          <option [ngValue]="field.value">
            {{ field.label }}
          </option>
        }
      </select>
    </div>

    <div>
      <label for="goal-direction" class="form-label"> Direction </label>

      <select id="goal-direction" [formControl]="form.controls.sortDirection" class="form-control">
        <option [ngValue]="0">Ascending</option>
        <option [ngValue]="1">Descending</option>
      </select>
    </div>

    <div>
      <label for="goal-page-size" class="form-label"> Results per page </label>

      <select id="goal-page-size" [formControl]="form.controls.pageSize" class="form-control">
        <option [ngValue]="5">5</option>
        <option [ngValue]="10">10</option>
        <option [ngValue]="20">20</option>
      </select>
    </div>
  </div>

  <div class="mt-5 flex justify-end border-t border-line pt-4">
    <button type="button" (click)="reset()" class="btn-ghost">Clear filters</button>
  </div>
</section>
