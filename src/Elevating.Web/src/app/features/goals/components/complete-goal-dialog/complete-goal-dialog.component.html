<div class="fixed inset-0 z-50 flex items-center justify-center px-4">
  <button
    type="button"
    class="absolute inset-0 cursor-default bg-ink/45 backdrop-blur-sm"
    aria-label="Close completion dialog"
    [disabled]="processing()"
    (click)="cancelled.emit()"
  ></button>

  <section
    role="dialog"
    aria-modal="true"
    aria-labelledby="complete-dialog-title"
    aria-describedby="complete-dialog-description"
    class="relative z-10 w-full max-w-lg rounded-3xl border border-line bg-surface-raised p-6 shadow-dialog sm:p-8"
  >
    <div
      class="flex h-14 w-14 items-center justify-center rounded-full bg-gold-soft text-2xl text-gold"
      aria-hidden="true"
    >
      ✦
    </div>

    <p class="app-eyebrow mt-5">Finish your way</p>

    <h2 id="complete-dialog-title" class="mt-2 text-2xl font-semibold text-ink">
      What happened to the remaining actions?
    </h2>

    <p id="complete-dialog-description" class="mt-3 text-sm leading-7 text-muted">
      <strong class="text-ink">
        {{ goal().pendingActionCount }}
        {{ goal().pendingActionCount === 1 ? 'action is' : 'actions are' }}
      </strong>
      still open. They may already be done, or they may no longer be necessary.
    </p>

    <div class="mt-7 grid gap-3">
      <button
        type="button"
        (click)="completeAll.emit()"
        [disabled]="processing()"
        class="rounded-2xl border border-sage bg-sage-soft p-4 text-left transition hover:bg-moss-soft disabled:opacity-50"
      >
        <span class="font-semibold text-moss"> ✓ Complete all remaining actions </span>

        <span class="mt-1 block text-sm leading-6 text-muted">
          Use this when the steps were completed but not checked off individually.
        </span>
      </button>

      <button
        type="button"
        (click)="skipRemaining.emit()"
        [disabled]="processing()"
        class="rounded-2xl border border-line bg-surface-muted p-4 text-left transition hover:border-line-strong hover:bg-brand-soft disabled:opacity-50"
      >
        <span class="font-semibold text-ink"> ↗ Skip the remaining actions </span>

        <span class="mt-1 block text-sm leading-6 text-muted">
          Use this when those steps were no longer needed. They will remain visible as skipped.
        </span>
      </button>
    </div>

    <button
      type="button"
      (click)="cancelled.emit()"
      [disabled]="processing()"
      class="btn-ghost mt-5 w-full"
    >
      Keep working on this goal
    </button>
  </section>
</div>
