<div class="fixed inset-0 z-50 flex items-center justify-center px-4">
  <button
    type="button"
    class="absolute inset-0 cursor-default bg-ink/45 backdrop-blur-sm"
    aria-label="Close delete confirmation dialog"
    (click)="cancel()"
    [disabled]="deleting()"
  ></button>

  <section
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="delete-dialog-title"
    aria-describedby="delete-dialog-description"
    class="relative z-10 w-full max-w-md rounded-3xl border border-line bg-surface-raised p-6 shadow-dialog"
  >
    <div
      class="flex h-12 w-12 items-center justify-center rounded-full bg-danger-soft text-2xl font-black text-danger"
      aria-hidden="true"
    >
      !
    </div>

    <h2 id="delete-dialog-title" class="mt-5 text-2xl font-black text-ink">Delete this goal?</h2>

    <p id="delete-dialog-description" class="mt-3 text-sm leading-6 text-muted">
      You are about to permanently delete
      <strong class="text-ink"> “{{ goal().title }}” </strong>
      . This action cannot be undone.
    </p>

    <div class="mt-7 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
      <button type="button" (click)="cancel()" [disabled]="deleting()" class="btn-secondary">
        Cancel
      </button>

      <button type="button" (click)="confirm()" [disabled]="deleting()" class="btn-danger min-w-32">
        @if (deleting()) {
          <span
            class="mr-2 h-4 w-4 animate-spin rounded-full border-2 border-danger-soft border-t-white"
            aria-hidden="true"
          ></span>

          Deleting...
        } @else {
          Delete goal
        }
      </button>
    </div>
  </section>
</div>
