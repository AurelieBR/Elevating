<div class="fixed inset-0 z-50 flex items-center justify-center px-4">
  <button
    type="button"
    class="absolute inset-0 cursor-default bg-slate-950/50 backdrop-blur-sm"
    aria-label="Close delete confirmation dialog"
    (click)="cancel()"
    [disabled]="deleting()"
  ></button>

  <section
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="delete-dialog-title"
    aria-describedby="delete-dialog-description"
    class="relative z-10 w-full max-w-md rounded-3xl bg-white p-6 shadow-2xl"
  >
    <div
      class="flex h-12 w-12 items-center justify-center rounded-full bg-rose-100 text-2xl text-rose-700"
      aria-hidden="true"
    >
      !
    </div>

    <h2 id="delete-dialog-title" class="mt-5 text-2xl font-black text-slate-950">
      Delete this goal?
    </h2>

    <p id="delete-dialog-description" class="mt-3 text-sm leading-6 text-slate-600">
      You are about to permanently delete
      <strong class="text-slate-900"> “{{ goal().title }}” </strong>
      . This action cannot be undone.
    </p>

    <div class="mt-7 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
      <button
        type="button"
        (click)="cancel()"
        [disabled]="deleting()"
        class="rounded-xl border border-slate-300 bg-white px-5 py-3 text-sm font-bold text-slate-700 transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-50"
      >
        Cancel
      </button>

      <button
        type="button"
        (click)="confirm()"
        [disabled]="deleting()"
        class="inline-flex min-w-32 items-center justify-center rounded-xl bg-rose-600 px-5 py-3 text-sm font-bold text-white transition hover:bg-rose-700 disabled:cursor-not-allowed disabled:opacity-50"
      >
        @if (deleting()) {
          <span
            class="mr-2 h-4 w-4 animate-spin rounded-full border-2 border-rose-200 border-t-white"
            aria-hidden="true"
          ></span>

          Deleting...
        } @else {
          Delete goal
        }
      </button>
    </div>
  </section>
</div>
