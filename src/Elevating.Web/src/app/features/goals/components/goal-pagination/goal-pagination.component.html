@if (totalPages() > 1) {
  <nav aria-label="Goals pagination" class="flex flex-wrap items-center justify-center gap-2">
    <button
      type="button"
      [disabled]="!hasPreviousPage()"
      (click)="goToPage(pageNumber() - 1)"
      class="btn-secondary px-4 py-2 disabled:cursor-not-allowed disabled:opacity-40"
    >
      Previous
    </button>

    @for (page of visiblePages(); track page) {
      <button
        type="button"
        (click)="goToPage(page)"
        [attr.aria-current]="page === pageNumber() ? 'page' : null"
        class="h-10 min-w-10 rounded-xl px-3 text-sm font-semibold transition"
        [class.bg-brand]="page === pageNumber()"
        [class.text-white]="page === pageNumber()"
        [class.shadow-sm]="page === pageNumber()"
        [class.bg-surface]="page !== pageNumber()"
        [class.text-ink-soft]="page !== pageNumber()"
        [class.border]="page !== pageNumber()"
        [class.border-line]="page !== pageNumber()"
        [class.hover:border-sage]="page !== pageNumber()"
        [class.hover:text-moss]="page !== pageNumber()"
      >
        {{ page }}
      </button>
    }

    <button
      type="button"
      [disabled]="!hasNextPage()"
      (click)="goToPage(pageNumber() + 1)"
      class="btn-secondary px-4 py-2 disabled:cursor-not-allowed disabled:opacity-40"
    >
      Next
    </button>
  </nav>
}
