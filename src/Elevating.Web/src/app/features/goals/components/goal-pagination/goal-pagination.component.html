@if (totalPages() > 1) {
  <nav aria-label="Goals pagination" class="flex flex-wrap items-center justify-center gap-2">
    <button
      type="button"
      [disabled]="!hasPreviousPage()"
      (click)="goToPage(pageNumber() - 1)"
      class="rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 transition hover:border-violet-300 hover:text-violet-700 disabled:cursor-not-allowed disabled:opacity-40"
    >
      Previous
    </button>

    @for (page of visiblePages(); track page) {
      <button
        type="button"
        (click)="goToPage(page)"
        [attr.aria-current]="page === pageNumber() ? 'page' : null"
        class="h-10 min-w-10 rounded-xl px-3 text-sm font-semibold transition"
        [class.bg-violet-600]="page === pageNumber()"
        [class.text-white]="page === pageNumber()"
        [class.bg-white]="page !== pageNumber()"
        [class.text-slate-700]="page !== pageNumber()"
        [class.border]="page !== pageNumber()"
        [class.border-slate-300]="page !== pageNumber()"
        [class.hover:border-violet-300]="page !== pageNumber()"
      >
        {{ page }}
      </button>
    }

    <button
      type="button"
      [disabled]="!hasNextPage()"
      (click)="goToPage(pageNumber() + 1)"
      class="rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 transition hover:border-violet-300 hover:text-violet-700 disabled:cursor-not-allowed disabled:opacity-40"
    >
      Next
    </button>
  </nav>
}
